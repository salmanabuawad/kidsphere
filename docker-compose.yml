# Optional: PostgreSQL via Docker (alternative to `npm run db:start`).
# Matches the default DATABASE_URL port (5433) and credentials in .env.example.
services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: kidsphere
      POSTGRES_PASSWORD: kidsphere
      POSTGRES_DB: ks_app
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
    ports:
      - "5433:5432"
    volumes:
      - kidsphere-pg:/var/lib/postgresql/data
      - ./scripts/docker-init.sql:/docker-entrypoint-initdb.d/init.sql:ro
volumes:
  kidsphere-pg:
