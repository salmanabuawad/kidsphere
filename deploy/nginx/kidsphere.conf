# nginx site for Kidsphere. __DOMAIN__ / __PORT__ are filled in by deploy/install.sh.
# certbot --nginx adds the 443 server block and the HTTP→HTTPS redirect.
server {
    listen 80;
    server_name __DOMAIN__;

    # Narration and photo uploads (the app enforces its own 8/15 MB limits).
    client_max_body_size 20M;

    location /.well-known/acme-challenge/ { root /var/www/html; }

    location /_next/static/ {
        proxy_pass http://127.0.0.1:__PORT__;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        proxy_pass http://127.0.0.1:__PORT__;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_read_timeout 120s;
    }
}
