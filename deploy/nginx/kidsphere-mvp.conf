# /etc/nginx/sites-available/kidsphere-mvp — KidSphere MVP at kids.kortexd.com.
#
#   /          React build (/var/www/kidsphere/frontend/dist), SPA fallback
#   /assets/   hashed build assets, cached for a year
#   /api/      FastAPI (kidsphere-mvp-api.service on 127.0.0.1:3071)
#   /uploads/  never served: child photos go through the authenticated API only
#
# The login rate-limit zone lives in /etc/nginx/conf.d/kidsphere-ratelimit.conf.

server {
    listen 80;
    listen [::]:80;
    server_name kids.kortexd.com;
    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name kids.kortexd.com;

    ssl_certificate     /etc/letsencrypt/live/kids.kortexd.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/kids.kortexd.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    access_log /var/log/nginx/kidsphere.access.log;
    error_log  /var/log/nginx/kidsphere.error.log;

    root /var/www/kidsphere/frontend/dist;
    index index.html;
    client_max_body_size 10m;

    location ^~ /uploads/ { return 404; }

    location /assets/ {
        include snippets/kidsphere-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    location = /api/auth/login {
        limit_req zone=kidsphere_login burst=5 nodelay;
        limit_req_status 429;
        include snippets/kidsphere-headers.conf;
        add_header Cache-Control "no-store" always;
        proxy_pass http://127.0.0.1:3071;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/ {
        include snippets/kidsphere-headers.conf;
        add_header Cache-Control "no-store" always;
        proxy_pass http://127.0.0.1:3071;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        # AI generation can take a while.
        proxy_read_timeout 300s;
    }

    location / {
        include snippets/kidsphere-headers.conf;
        add_header Cache-Control "no-cache" always;
        try_files $uri /index.html;
    }
}
