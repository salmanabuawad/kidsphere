<!-- @dsCard group="Profile" height=290 subtitle="Workflow and review statuses as words, never scores" -->
<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Badge preview</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+Bhaijaan+2:wght@400..800&family=Fredoka:wght@300..700&family=Rubik:wght@300..900&display=swap">
</head>
<body>
<div class="ks-preview" lang="en" dir="ltr">
  <div class="ks-stack ks-stack--tight">
    <p class="ks-note">Content status</p>
    <div class="ks-row ks-row--tight">
      <span class="ks-badge ks-badge--draft"><svg class="ks-glyph ks-glyph--14" viewBox="0 0 24 24" aria-hidden="true"><path d="M21.174 6.812a1 1 0 0 0-3.986-3.987L3.842 16.174a2 2 0 0 0-.5.83l-1.321 4.352a.5.5 0 0 0 .623.622l4.353-1.32a2 2 0 0 0 .83-.497z"/><path d="m15 5 4 4"/></svg>Draft</span>
      <span class="ks-badge ks-badge--ready">Ready</span>
      <span class="ks-badge ks-badge--approved"><svg class="ks-glyph ks-glyph--14" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 6 9 17l-5-5"/></svg>Approved</span>
      <span class="ks-badge ks-badge--archived">Archived</span>
      <span class="ks-badge ks-badge--error"><svg class="ks-glyph ks-glyph--14" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="10"/><path d="M12 8v4"/><path d="M12 16h.01"/></svg>Video not finished</span>
    </div>
  </div>
  <div class="ks-stack ks-stack--tight">
    <p class="ks-note">Focus and development review</p>
    <div class="ks-row ks-row--tight">
      <span class="ks-badge ks-badge--attention"><img class="ks-ico ks-ico--14 ks-ico--l" src="../../assets/Icons/attention.svg" alt=""><img class="ks-ico ks-ico--14 ks-ico--d" src="../../assets/Icons/dark/attention.svg" alt="">Focus slots full</span>
      <span class="ks-badge ks-badge--review">Improving</span>
      <span class="ks-badge ks-badge--review">Some improvement</span>
      <span class="ks-badge ks-badge--review">No clear change</span>
      <span class="ks-badge ks-badge--attention">Needs more observation</span>
    </div>
  </div>
  <div class="ks-stack ks-stack--tight" lang="ar" dir="rtl">
    <p class="ks-note">بالعربية</p>
    <div class="ks-row ks-row--tight">
      <span class="ks-badge ks-badge--draft"><svg class="ks-glyph ks-glyph--14" viewBox="0 0 24 24" aria-hidden="true"><path d="M21.174 6.812a1 1 0 0 0-3.986-3.987L3.842 16.174a2 2 0 0 0-.5.83l-1.321 4.352a.5.5 0 0 0 .623.622l4.353-1.32a2 2 0 0 0 .83-.497z"/><path d="m15 5 4 4"/></svg>مسودة</span>
      <span class="ks-badge ks-badge--approved"><svg class="ks-glyph ks-glyph--14" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 6 9 17l-5-5"/></svg>معتمد</span>
      <span class="ks-badge ks-badge--review">يتحسّن</span>
      <span class="ks-badge ks-badge--attention">يحتاج إلى مزيد من الملاحظة</span>
    </div>
  </div>
  <div class="ks-stack ks-stack--tight" lang="he" dir="rtl">
    <p class="ks-note">בעברית</p>
    <div class="ks-row ks-row--tight">
      <span class="ks-badge ks-badge--ready">מוכן</span>
      <span class="ks-badge ks-badge--review">שיפור חלקי</span>
      <span class="ks-badge ks-badge--attention">נדרשת תצפית נוספת</span>
    </div>
  </div>
</div>
</body>
</html>
