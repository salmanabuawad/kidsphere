<!-- @dsCard group="Content" height=630 subtitle="Story, video, game, activity and pack as kindergarten objects, all in sky paint; inline tile, picker tile and content card" -->
<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ContentTypeTile preview</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+Bhaijaan+2:wght@400..800&family=Fredoka:wght@300..700&family=Rubik:wght@300..900&display=swap">
</head>
<body>
<div class="ks-preview" lang="en" dir="ltr">
  <div class="ks-stack ks-stack--tight">
    <p class="ks-note">Inline tiles: 48px tray block, 28px icon</p>
    <div class="ks-row">
      <span class="ks-ctile" title="Story"><img class="ks-ico ks-ico--28 ks-ico--mirror ks-ico--l" src="../../assets/Icons/story.svg" alt="Story"><img class="ks-ico ks-ico--28 ks-ico--mirror ks-ico--d" src="../../assets/Icons/dark/story.svg" alt="Story"></span>
      <span class="ks-ctile" title="Video"><img class="ks-ico ks-ico--28 ks-ico--l" src="../../assets/Icons/video.svg" alt="Video"><img class="ks-ico ks-ico--28 ks-ico--d" src="../../assets/Icons/dark/video.svg" alt="Video"></span>
      <span class="ks-ctile" title="Digital game"><img class="ks-ico ks-ico--28 ks-ico--l" src="../../assets/Icons/game.svg" alt="Digital game"><img class="ks-ico ks-ico--28 ks-ico--d" src="../../assets/Icons/dark/game.svg" alt="Digital game"></span>
      <span class="ks-ctile" title="Real-world activity"><img class="ks-ico ks-ico--28 ks-ico--l" src="../../assets/Icons/activity.svg" alt="Real-world activity"><img class="ks-ico ks-ico--28 ks-ico--d" src="../../assets/Icons/dark/activity.svg" alt="Real-world activity"></span>
      <span class="ks-ctile" title="Small pack"><img class="ks-ico ks-ico--28 ks-ico--l" src="../../assets/Icons/pack.svg" alt="Small pack"><img class="ks-ico ks-ico--28 ks-ico--d" src="../../assets/Icons/dark/pack.svg" alt="Small pack"></span>
    </div>
  </div>

  <div class="ks-fieldset">
    <span class="ks-legend" id="pick">What would you like to create?</span>
    <div class="ks-picker-grid" role="radiogroup" aria-labelledby="pick">
      <button type="button" role="radio" class="ks-picker" aria-checked="true">
        <span class="ks-picker__icon"><img class="ks-ico ks-ico--40 ks-ico--mirror ks-ico--l" src="../../assets/Icons/story.svg" alt=""><img class="ks-ico ks-ico--40 ks-ico--mirror ks-ico--d" src="../../assets/Icons/dark/story.svg" alt=""></span>
        <span class="ks-body-strong">Story</span>
        <span class="ks-picker__desc">A short personal story</span>
        <span class="ks-checkblock"><svg class="ks-glyph ks-glyph--16" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 6 9 17l-5-5"/></svg></span>
      </button>
      <button type="button" role="radio" class="ks-picker is-hover" aria-checked="false">
        <span class="ks-picker__icon"><img class="ks-ico ks-ico--40 ks-ico--l" src="../../assets/Icons/video.svg" alt=""><img class="ks-ico ks-ico--40 ks-ico--d" src="../../assets/Icons/dark/video.svg" alt=""></span>
        <span class="ks-body-strong">Video</span>
        <span class="ks-picker__desc">Script and scenes</span>
        <span class="ks-checkblock"><svg class="ks-glyph ks-glyph--16" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 6 9 17l-5-5"/></svg></span>
      </button>
      <button type="button" role="radio" class="ks-picker" aria-checked="false">
        <span class="ks-picker__icon"><img class="ks-ico ks-ico--40 ks-ico--l" src="../../assets/Icons/game.svg" alt=""><img class="ks-ico ks-ico--40 ks-ico--d" src="../../assets/Icons/dark/game.svg" alt=""></span>
        <span class="ks-body-strong">Digital game</span>
        <span class="ks-picker__desc">Play on a tablet</span>
        <span class="ks-checkblock"><svg class="ks-glyph ks-glyph--16" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 6 9 17l-5-5"/></svg></span>
      </button>
      <button type="button" role="radio" class="ks-picker" aria-checked="false">
        <span class="ks-picker__icon"><img class="ks-ico ks-ico--40 ks-ico--l" src="../../assets/Icons/activity.svg" alt=""><img class="ks-ico ks-ico--40 ks-ico--d" src="../../assets/Icons/dark/activity.svg" alt=""></span>
        <span class="ks-body-strong">Real-world activity</span>
        <span class="ks-picker__desc">Teacher-led, in the room</span>
        <span class="ks-checkblock"><svg class="ks-glyph ks-glyph--16" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 6 9 17l-5-5"/></svg></span>
      </button>
      <button type="button" role="radio" class="ks-picker" aria-checked="false">
        <span class="ks-picker__icon"><img class="ks-ico ks-ico--40 ks-ico--l" src="../../assets/Icons/pack.svg" alt=""><img class="ks-ico ks-ico--40 ks-ico--d" src="../../assets/Icons/dark/pack.svg" alt=""></span>
        <span class="ks-body-strong">Small pack</span>
        <span class="ks-picker__desc">Story, activity and game</span>
        <span class="ks-checkblock"><svg class="ks-glyph ks-glyph--16" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 6 9 17l-5-5"/></svg></span>
      </button>
    </div>
  </div>

  <div class="ks-cols">
    <a class="ks-card ks-card--tap ks-content" href="#bus">
      <span class="ks-ctile"><img class="ks-ico ks-ico--28 ks-ico--mirror ks-ico--l" src="../../assets/Icons/story.svg" alt=""><img class="ks-ico ks-ico--28 ks-ico--mirror ks-ico--d" src="../../assets/Icons/dark/story.svg" alt=""></span>
      <span class="ks-stack ks-stack--tight">
        <span class="ks-title">Adam and the big red bus</span>
        <span class="ks-caption">Story · Arabic</span>
        <span class="ks-content__meta">
          <span class="ks-modetag ks-modetag--strength"><img class="ks-ico ks-ico--16 ks-ico--l" src="../../assets/Icons/strength-builder.svg" alt=""><img class="ks-ico ks-ico--16 ks-ico--d" src="../../assets/Icons/dark/strength-builder.svg" alt="">Strength Builder</span>
          <span class="ks-badge ks-badge--approved"><svg class="ks-glyph ks-glyph--14" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 6 9 17l-5-5"/></svg>Approved</span>
        </span>
      </span>
    </a>
    <a class="ks-card ks-card--tap ks-content" href="#tower">
      <span class="ks-ctile"><img class="ks-ico ks-ico--28 ks-ico--l" src="../../assets/Icons/activity.svg" alt=""><img class="ks-ico ks-ico--28 ks-ico--d" src="../../assets/Icons/dark/activity.svg" alt=""></span>
      <span class="ks-stack ks-stack--tight">
        <span class="ks-title">The block tower game</span>
        <span class="ks-caption">Real-world activity · 15 minutes</span>
        <span class="ks-content__meta">
          <span class="ks-modetag ks-modetag--growth"><img class="ks-ico ks-ico--16 ks-ico--l" src="../../assets/Icons/growth-support.svg" alt=""><img class="ks-ico ks-ico--16 ks-ico--d" src="../../assets/Icons/dark/growth-support.svg" alt="">Growth Support</span>
          <span class="ks-badge ks-badge--draft"><svg class="ks-glyph ks-glyph--14" viewBox="0 0 24 24" aria-hidden="true"><path d="M21.174 6.812a1 1 0 0 0-3.986-3.987L3.842 16.174a2 2 0 0 0-.5.83l-1.321 4.352a.5.5 0 0 0 .623.622l4.353-1.32a2 2 0 0 0 .83-.497z"/><path d="m15 5 4 4"/></svg>Draft</span>
        </span>
      </span>
    </a>
    <a class="ks-card ks-card--tap ks-content" href="#bus-he" lang="he" dir="rtl">
      <span class="ks-ctile"><img class="ks-ico ks-ico--28 ks-ico--l" src="../../assets/Icons/game.svg" alt=""><img class="ks-ico ks-ico--28 ks-ico--d" src="../../assets/Icons/dark/game.svg" alt=""></span>
      <span class="ks-stack ks-stack--tight">
        <span class="ks-title">אדם מסדר את התחנות</span>
        <span class="ks-caption">משחק דיגיטלי · לפי הסדר</span>
        <span class="ks-content__meta">
          <span class="ks-modetag ks-modetag--strength"><img class="ks-ico ks-ico--16 ks-ico--l" src="../../assets/Icons/strength-builder.svg" alt=""><img class="ks-ico ks-ico--16 ks-ico--d" src="../../assets/Icons/dark/strength-builder.svg" alt="">חיזוק חוזקות</span>
          <span class="ks-badge ks-badge--ready">מוכן</span>
        </span>
      </span>
    </a>
  </div>
</div>
</body>
</html>
