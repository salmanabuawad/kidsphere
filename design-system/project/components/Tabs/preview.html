<!-- @dsCard group="Navigation" height=310 subtitle="Segmented tabs on a tray track: the selected tab is a bordered block with a check" -->
<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tabs preview</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+Bhaijaan+2:wght@400..800&family=Fredoka:wght@300..700&family=Rubik:wght@300..900&display=swap">
</head>
<body>
<div class="ks-preview" lang="en" dir="ltr">
  <div class="ks-stack ks-stack--tight">
    <p class="ks-note">Child pages</p>
    <div class="ks-seg ks-tabs" role="tablist" aria-label="Child pages">
      <button type="button" role="tab" class="ks-seg__opt" aria-selected="true"><svg class="ks-glyph ks-glyph--16 ks-seg__check" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 6 9 17l-5-5"/></svg>Profile</button>
      <button type="button" role="tab" class="ks-seg__opt is-hover" aria-selected="false" tabindex="-1"><svg class="ks-glyph ks-glyph--16 ks-seg__check" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 6 9 17l-5-5"/></svg>Timeline</button>
      <button type="button" role="tab" class="ks-seg__opt" aria-selected="false" tabindex="-1"><svg class="ks-glyph ks-glyph--16 ks-seg__check" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 6 9 17l-5-5"/></svg>Content</button>
      <button type="button" role="tab" class="ks-seg__opt" aria-selected="false" tabindex="-1"><svg class="ks-glyph ks-glyph--16 ks-seg__check" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 6 9 17l-5-5"/></svg>Development</button>
    </div>
  </div>
  <div class="ks-stack ks-stack--tight" style="max-width: 360px">
    <p class="ks-note">More than four tabs: the track scrolls with snap, no fade</p>
    <div class="ks-seg ks-tabs" role="tablist" aria-label="Content">
      <button type="button" role="tab" class="ks-seg__opt" aria-selected="false" tabindex="-1"><svg class="ks-glyph ks-glyph--16 ks-seg__check" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 6 9 17l-5-5"/></svg>All</button>
      <button type="button" role="tab" class="ks-seg__opt is-focus" aria-selected="true"><svg class="ks-glyph ks-glyph--16 ks-seg__check" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 6 9 17l-5-5"/></svg>Drafts waiting</button>
      <button type="button" role="tab" class="ks-seg__opt" aria-selected="false" tabindex="-1"><svg class="ks-glyph ks-glyph--16 ks-seg__check" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 6 9 17l-5-5"/></svg>Ready to use</button>
      <button type="button" role="tab" class="ks-seg__opt" aria-selected="false" tabindex="-1"><svg class="ks-glyph ks-glyph--16 ks-seg__check" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 6 9 17l-5-5"/></svg>Used</button>
      <button type="button" role="tab" class="ks-seg__opt" aria-selected="false" tabindex="-1"><svg class="ks-glyph ks-glyph--16 ks-seg__check" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 6 9 17l-5-5"/></svg>Archived</button>
    </div>
  </div>
  <div class="ks-stack ks-stack--tight" lang="ar" dir="rtl">
    <p class="ks-note">بالعربية</p>
    <div class="ks-seg ks-tabs" role="tablist" aria-label="صفحات الطفل">
      <button type="button" role="tab" class="ks-seg__opt" aria-selected="false" tabindex="-1"><svg class="ks-glyph ks-glyph--16 ks-seg__check" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 6 9 17l-5-5"/></svg>الملف</button>
      <button type="button" role="tab" class="ks-seg__opt" aria-selected="true"><svg class="ks-glyph ks-glyph--16 ks-seg__check" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 6 9 17l-5-5"/></svg>الخط الزمني</button>
      <button type="button" role="tab" class="ks-seg__opt" aria-selected="false" tabindex="-1"><svg class="ks-glyph ks-glyph--16 ks-seg__check" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 6 9 17l-5-5"/></svg>المحتوى</button>
      <button type="button" role="tab" class="ks-seg__opt" aria-selected="false" tabindex="-1"><svg class="ks-glyph ks-glyph--16 ks-seg__check" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 6 9 17l-5-5"/></svg>التطور</button>
    </div>
  </div>
</div>
</body>
</html>
