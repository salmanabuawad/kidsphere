<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Avatar preview</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+Bhaijaan+2:wght@400..800&family=Fredoka:wght@300..700&family=Rubik:wght@300..900&display=swap">
</head>
<body>
<div class="ks-preview" lang="en" dir="ltr">
  <div class="ks-stack ks-stack--tight">
    <p class="ks-note">Sizes 32, 40, 48, 56 and 80</p>
    <div class="ks-row ks-row--top">
      <span class="ks-avatar ks-avatar--32" role="img" aria-label="Adam">A</span>
      <span class="ks-avatar ks-avatar--40" role="img" aria-label="Adam">A</span>
      <span class="ks-avatar" role="img" aria-label="Adam">A</span>
      <span class="ks-avatar ks-avatar--56" role="img" aria-label="Adam">A</span>
      <span class="ks-avatar ks-avatar--80" role="img" aria-label="Adam">A</span>
    </div>
  </div>
  <div class="ks-stack ks-stack--tight">
    <p class="ks-note">Arabic initials in Baloo Bhaijaan 2, Hebrew and Latin in Fredoka; one or two letters</p>
    <div class="ks-row">
      <span class="ks-avatar" lang="ar" role="img" aria-label="يوسف">ي</span>
      <span class="ks-avatar" lang="ar" role="img" aria-label="لينا">ل</span>
      <span class="ks-avatar" lang="he" role="img" aria-label="נועה לוי">נל</span>

      <span class="ks-avatar ks-avatar--56" lang="he" role="img" aria-label="איתי">א</span>
    </div>
  </div>
  <div class="ks-stack ks-stack--tight" lang="ar" dir="rtl">
    <p class="ks-note">في صف القائمة: الصورة الرمزية في بداية السطر، جهة اليمين</p>
    <a class="ks-listrow" href="#yousef"><span class="ks-avatar ks-avatar--40" aria-hidden="true">ي</span><span class="ks-listrow__text"><span class="ks-name" dir="auto">يوسف</span><span class="ks-caption">3 سنوات و11 شهراً</span></span></a>
  </div>
</div>
</body>
</html>
