<!-- @dsCard group="Play" height=890 subtitle="Gentle feedback bubbles for children: warm, think and calm, never wrong" -->
<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>KidFeedback preview</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+Bhaijaan+2:wght@400..800&family=Fredoka:wght@300..700&family=Rubik:wght@300..900&display=swap">
</head>
<body>
<div class="ks-preview">
  <div class="ks-stage" lang="en" dir="ltr">
    <div class="ks-stage__inner ks-stack">
      <div class="ks-bubble ks-bubble--warm" role="status" aria-live="polite">
        <img class="ks-ico ks-ico--40 ks-ico--l" src="../../assets/Icons/strengths.svg" alt=""><img class="ks-ico ks-ico--40 ks-ico--d" src="../../assets/Icons/dark/strengths.svg" alt="">
        <p class="ks-bubble__title">Yes! They go together!</p>
        <p class="ks-bubble__body" dir="auto">The bus and the bus stop are a pair.</p>
      </div>
      <div class="ks-bubble ks-bubble--think" role="status" aria-live="polite">
        <p class="ks-bubble__title">Let's try another one</p>
        <p class="ks-bubble__body" dir="auto">Hmm, what comes first?</p>
      </div>
      <div class="ks-bubble ks-bubble--calm" role="status" aria-live="polite">
        <p class="ks-bubble__title">Thank you for choosing!</p>
        <p class="ks-bubble__body" dir="auto">Every answer is welcome.</p>
      </div>
    </div>
  </div>
  <div class="ks-stage" lang="ar" dir="rtl">
    <div class="ks-stage__inner ks-stack">
      <div class="ks-bubble ks-bubble--warm" role="status" aria-live="polite">
        <img class="ks-ico ks-ico--40 ks-ico--l" src="../../assets/Icons/strengths.svg" alt=""><img class="ks-ico ks-ico--40 ks-ico--d" src="../../assets/Icons/dark/strengths.svg" alt="">
        <p class="ks-bubble__title">أحسنت! هذا مكانها.</p>
      </div>
      <div class="ks-bubble ks-bubble--think" role="status" aria-live="polite" lang="he">
        <p class="ks-bubble__title">בואו ננסה עוד אחד</p>
        <p class="ks-bubble__body" dir="auto">הממ, מה בא אחר כך?</p>
      </div>
    </div>
  </div>
</div>
</body>
</html>
