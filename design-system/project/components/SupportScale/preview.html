<!-- @dsCard group="Forms" height=420 subtitle="Three neutral levels on a tray track; the selected one is a bordered block with a check, never a colour per level" -->
<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SupportScale preview</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+Bhaijaan+2:wght@400..800&family=Fredoka:wght@300..700&family=Rubik:wght@300..900&display=swap">
</head>
<body>
<div class="ks-preview" lang="en" dir="ltr">
  <div class="ks-fieldset">
    <span class="ks-legend" id="sup1">How much support was needed?</span>
    <div class="ks-seg" role="radiogroup" aria-labelledby="sup1">
      <button type="button" role="radio" class="ks-seg__opt" aria-checked="false"><svg class="ks-glyph ks-glyph--16 ks-seg__check" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 6 9 17l-5-5"/></svg>Independent</button>
      <button type="button" role="radio" class="ks-seg__opt is-focus" aria-checked="true"><svg class="ks-glyph ks-glyph--16 ks-seg__check" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 6 9 17l-5-5"/></svg>With support</button>
      <button type="button" role="radio" class="ks-seg__opt is-hover" aria-checked="false"><svg class="ks-glyph ks-glyph--16 ks-seg__check" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 6 9 17l-5-5"/></svg>Difficult</button>
    </div>
    <p class="ks-note">With support selected and focused; Difficult hovered.</p>
  </div>

  <div class="ks-fieldset">
    <span class="ks-legend" id="sup2">Did the child need support?</span>
    <div class="ks-seg" role="radiogroup" aria-labelledby="sup2">
      <button type="button" role="radio" class="ks-seg__opt" aria-checked="true"><svg class="ks-glyph ks-glyph--16 ks-seg__check" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 6 9 17l-5-5"/></svg>No</button>
      <button type="button" role="radio" class="ks-seg__opt" aria-checked="false"><svg class="ks-glyph ks-glyph--16 ks-seg__check" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 6 9 17l-5-5"/></svg>Some</button>
      <button type="button" role="radio" class="ks-seg__opt" aria-checked="false"><svg class="ks-glyph ks-glyph--16 ks-seg__check" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 6 9 17l-5-5"/></svg>Significant</button>
    </div>
  </div>

  <div class="ks-fieldset" lang="ar" dir="rtl">
    <span class="ks-legend" id="sup3">كم من الدعم احتاج الطفل؟</span>
    <div class="ks-seg" role="radiogroup" aria-labelledby="sup3">
      <button type="button" role="radio" class="ks-seg__opt" aria-checked="true"><svg class="ks-glyph ks-glyph--16 ks-seg__check" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 6 9 17l-5-5"/></svg>مستقل</button>
      <button type="button" role="radio" class="ks-seg__opt" aria-checked="false"><svg class="ks-glyph ks-glyph--16 ks-seg__check" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 6 9 17l-5-5"/></svg>بمساعدة</button>
      <button type="button" role="radio" class="ks-seg__opt" aria-checked="false"><svg class="ks-glyph ks-glyph--16 ks-seg__check" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 6 9 17l-5-5"/></svg>يجد صعوبة</button>
    </div>
  </div>

  <div class="ks-fieldset" lang="he" dir="rtl">
    <span class="ks-legend" id="sup4">כמה תמיכה נדרשה?</span>
    <div class="ks-seg" role="radiogroup" aria-labelledby="sup4">
      <button type="button" role="radio" class="ks-seg__opt" aria-checked="false"><svg class="ks-glyph ks-glyph--16 ks-seg__check" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 6 9 17l-5-5"/></svg>עצמאי/ת</button>
      <button type="button" role="radio" class="ks-seg__opt" aria-checked="false"><svg class="ks-glyph ks-glyph--16 ks-seg__check" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 6 9 17l-5-5"/></svg>בתיווך</button>
      <button type="button" role="radio" class="ks-seg__opt" aria-checked="true"><svg class="ks-glyph ks-glyph--16 ks-seg__check" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 6 9 17l-5-5"/></svg>מתקשה</button>
    </div>
  </div>
</div>
</body>
</html>
