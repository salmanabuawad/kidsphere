<!-- @dsCard group="Play" height=370 subtitle="Progress as little blocks, never numbers: upcoming, done and the current long block" -->
<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dots preview</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+Bhaijaan+2:wght@400..800&family=Fredoka:wght@300..700&family=Rubik:wght@300..900&display=swap">
</head>
<body>
<div class="ks-preview">
  <div class="ks-stage" lang="en" dir="ltr">
    <div class="ks-stage__inner ks-stack">
      <div class="ks-stack ks-stack--tight">
        <div class="ks-dots" aria-hidden="true"><span class="ks-dot ks-dot--current"></span><span class="ks-dot"></span><span class="ks-dot"></span><span class="ks-dot"></span><span class="ks-dot"></span></div>
        <span class="ks-sr">Page 1 of 5</span>
        <p class="ks-note" style="text-align: center">first page</p>
      </div>
      <div class="ks-stack ks-stack--tight">
        <div class="ks-dots" aria-hidden="true"><span class="ks-dot ks-dot--done"></span><span class="ks-dot ks-dot--done"></span><span class="ks-dot ks-dot--current"></span><span class="ks-dot"></span><span class="ks-dot"></span></div>
        <span class="ks-sr">Page 3 of 5</span>
        <p class="ks-note" style="text-align: center">third page: two done, current, two upcoming</p>
      </div>
    </div>
  </div>
  <div class="ks-stage" lang="he" dir="rtl">
    <div class="ks-stage__inner ks-stack ks-stack--tight">
      <div class="ks-dots" aria-hidden="true"><span class="ks-dot ks-dot--done"></span><span class="ks-dot ks-dot--done"></span><span class="ks-dot ks-dot--done"></span><span class="ks-dot ks-dot--current"></span><span class="ks-dot"></span></div>
      <span class="ks-sr">עמוד 4 מתוך 5</span>
      <p class="ks-note" style="text-align: center">בעברית ההתקדמות זורמת מימין לשמאל</p>
    </div>
  </div>
</div>
</body>
</html>
