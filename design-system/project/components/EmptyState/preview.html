<!-- @dsCard group="Feedback" height=810 subtitle="Kind, slightly playful empty states, each with a small block scene and one clear next step" -->
<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>EmptyState preview</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+Bhaijaan+2:wght@400..800&family=Fredoka:wght@300..700&family=Rubik:wght@300..900&display=swap">
</head>
<body>
<div class="ks-preview">
  <div class="ks-cols">
    <section class="ks-card" lang="en" dir="ltr">
      <div class="ks-empty">
        <svg class="ks-empty__scene" viewBox="0 0 120 96" aria-hidden="true">
          <path class="ks-p-none ks-s-line" stroke-width="3" d="M8 88H112"/>
          <path class="ks-p-sky ks-s-ink" stroke-width="3" d="M26 48H74A6 6 0 0 1 80 54V88H62A12 12 0 0 0 38 88H20V54A6 6 0 0 1 26 48Z"/>
          <circle class="ks-p-sun ks-s-ink" stroke-width="3" cx="96" cy="78" r="10"/>
        </svg>
        <h3 class="ks-title">The block corner is empty.</h3>
        <p class="ks-empty__text">Add the first child to start getting to know them.</p>
        <div class="ks-empty__actions"><button type="button" class="ks-btn ks-btn--primary">Add child</button></div>
      </div>
    </section>

    <section class="ks-card" lang="en" dir="ltr">
      <div class="ks-empty">
        <svg class="ks-empty__scene" viewBox="0 0 120 96" aria-hidden="true">
          <path class="ks-p-none ks-s-line" stroke-width="3" d="M8 88H112"/>
          <path class="ks-p-none ks-s-ink" stroke-width="6" d="M57 65 70 78"/>
          <circle class="ks-p-sky ks-s-ink" stroke-width="3" cx="44" cy="52" r="18"/>
          <path class="ks-p-none ks-s-ink" stroke-width="4" d="M36 52H52M44 44V60"/>
          <circle class="ks-p-sun ks-s-ink" stroke-width="3" cx="92" cy="78" r="10"/>
        </svg>
        <h3 class="ks-title">Nothing noticed yet.</h3>
        <p class="ks-empty__text">What did Adam do today that made you smile?</p>
        <div class="ks-empty__actions">
          <button type="button" class="ks-btn ks-btn--primary"><svg class="ks-glyph" viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"/><path d="M15.4 15.4 20.5 20.5" stroke-width="3"/><path d="M8 10.5h5M10.5 8v5" stroke-width="2.5"/></svg>Add observation</button>
          <button type="button" class="ks-btn ks-btn--ghost">Back to profile</button>
        </div>
      </div>
    </section>

    <section class="ks-card" lang="ar" dir="rtl">
      <div class="ks-empty">
        <svg class="ks-empty__scene" viewBox="0 0 120 96" aria-hidden="true">
          <path class="ks-p-none ks-s-line" stroke-width="3" d="M8 88H112"/>
          <rect class="ks-p-sky ks-s-ink" stroke-width="3" x="24" y="60" width="60" height="28" rx="5"/>
          <rect class="ks-p-sky ks-s-ink" stroke-width="3" x="20" y="52" width="68" height="10" rx="4"/>
          <circle class="ks-p-sun ks-s-ink" stroke-width="3" cx="100" cy="78" r="10"/>
        </svg>
        <h3 class="ks-title">صندوق الألعاب بانتظارك.</h3>
        <p class="ks-empty__text">اصنعوا شيئاً خاصاً بآدم.</p>
        <div class="ks-empty__actions"><button type="button" class="ks-btn ks-btn--primary">إنشاء محتوى</button></div>
      </div>
    </section>

    <section class="ks-card" lang="he" dir="rtl">
      <div class="ks-empty">
        <svg class="ks-empty__scene" viewBox="0 0 120 96" aria-hidden="true">
          <path class="ks-p-none ks-s-line" stroke-width="3" d="M8 48H112"/>
          <path class="ks-p-sun ks-s-ink" stroke-width="3" d="M22 39 31 56H13Z"/>
          <circle class="ks-p-surface ks-s-ink" stroke-width="2" stroke-dasharray="4 3" cx="60" cy="48" r="9"/>
          <rect class="ks-p-surface ks-s-ink" stroke-width="2" stroke-dasharray="4 3" x="87" y="39" width="18" height="18" rx="4"/>
        </svg>
        <h3 class="ks-title">החוט מוכן לחרוז הראשון.</h3>
        <p class="ks-empty__text">תצפיות ותוצאות פעילויות יופיעו כאן.</p>
        <div class="ks-empty__actions"><button type="button" class="ks-btn ks-btn--primary">הוספת תצפית</button></div>
      </div>
    </section>
  </div>
</div>
</body>
</html>
