<!-- @dsCard group="Overlays" height=650 width=800 subtitle="Below md, dialogs and the More menu rise from the bottom with rounded top corners and a grabber" -->
<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BottomSheet preview</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+Bhaijaan+2:wght@400..800&family=Fredoka:wght@300..700&family=Rubik:wght@300..900&display=swap">
</head>
<body>
<div class="ks-preview">
  <div class="ks-row ks-row--top">
    <div class="ks-scrim ks-scrim--sheet ks-scrim--phone" lang="en" dir="ltr">
      <div class="ks-sheet" role="dialog" aria-modal="true" aria-labelledby="m1">
        <div class="ks-sheet__grabber" aria-hidden="true"></div>
        <div class="ks-dialog__head">
          <h2 class="ks-title" id="m1">Menu</h2>
          <button type="button" class="ks-iconbtn" aria-label="Close" title="Close"><svg class="ks-glyph" viewBox="0 0 24 24" aria-hidden="true"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg></button>
        </div>
        <ul class="ks-sheet__list">
          <li><a class="ks-navitem" href="#children" aria-current="page"><svg class="ks-glyph ks-glyph--24" viewBox="0 0 24 24" aria-hidden="true"><g class="ks-p-brand" stroke="none" transform="translate(0 1.5)"><path d="M13.39 15.98A4 4 0 0 1 20.5 18.5V20H13.5V17A5 5 0 0 0 13.39 15.98Z"/></g><circle cx="8.5" cy="6" r="3"/><path d="M3.5 20V17A5 5 0 0 1 13.5 17V20Z"/><circle cx="16.5" cy="9" r="2.5"/><path d="M13.39 15.98A4 4 0 0 1 20.5 18.5V20H13.5"/></svg>Children</a></li>
          <li><a class="ks-navitem" href="#users"><svg class="ks-glyph ks-glyph--24" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 6.86V5.5A2.5 2.5 0 0 1 10.5 3H18.5A2.5 2.5 0 0 1 21 5.5V16.5A2.5 2.5 0 0 1 18.5 19H17.14" transform="rotate(8 14.5 11)"/><rect x="3" y="6" width="13" height="16" rx="2.5"/><circle cx="9.5" cy="11.5" r="2"/><path d="M6.5 16.5H12.5M6.5 19H10.5"/></svg>Users</a></li>
          <li><a class="ks-navitem" href="#classes"><svg class="ks-glyph ks-glyph--24" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 11.5V19A2 2 0 0 0 7 21H17A2 2 0 0 0 19 19V11.5"/><path d="M3 11.5L12 3.5L21 11.5Z"/><circle cx="12" cy="8.3" r="1.5"/><path d="M10 21V17A2 2 0 0 1 14 17V21"/></svg>Classes</a></li>
          <li><a class="ks-navitem" href="#account"><svg class="ks-glyph ks-glyph--24" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="9" r="2.75"/><path d="M6.5 20.77V20A5.5 5.5 0 0 1 17.5 20V20.77"/></svg>My account</a></li>
        </ul>
        <hr class="ks-divider">
        <button type="button" class="ks-btn ks-btn--ghost ks-btn--block ks-btn--start"><svg class="ks-glyph ks-glyph--18 ks-glyph--mirror" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="m16 17 5-5-5-5"/><path d="M21 12H9"/></svg>Sign out</button>
      </div>
    </div>

    <div class="ks-scrim ks-scrim--sheet ks-scrim--phone" lang="ar" dir="rtl">
      <div class="ks-sheet ks-stack" role="dialog" aria-modal="true" aria-labelledby="m2">
        <div class="ks-sheet__grabber" aria-hidden="true"></div>
        <div class="ks-dialog__head">
          <h2 class="ks-title" id="m2">من الطفل الذي لاحظتِه؟</h2>
          <button type="button" class="ks-iconbtn" aria-label="إغلاق" title="إغلاق"><svg class="ks-glyph" viewBox="0 0 24 24" aria-hidden="true"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg></button>
        </div>
        <div class="ks-input-wrap">
          <svg class="ks-glyph ks-glyph--start" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
          <input class="ks-input ks-search" type="search" aria-label="البحث عن طفل" placeholder="البحث عن طفل">
        </div>
        <p class="ks-note">لوحظوا مؤخراً</p>
        <ul class="ks-sheet__list">
          <li><a class="ks-listrow" href="#lina"><span class="ks-avatar ks-avatar--40" aria-hidden="true">ل</span><span class="ks-listrow__text"><span class="ks-name" dir="auto">لينا</span><span class="ks-caption">آخر ملاحظة اليوم</span></span></a></li>
          <li><a class="ks-listrow is-hover" href="#adam"><span class="ks-avatar ks-avatar--40" aria-hidden="true">آ</span><span class="ks-listrow__text"><span class="ks-name" dir="auto">آدم</span><span class="ks-caption">آخر ملاحظة قبل يومين</span></span></a></li>
          <li><a class="ks-listrow" href="#yousef"><span class="ks-avatar ks-avatar--40" aria-hidden="true">ي</span><span class="ks-listrow__text"><span class="ks-name" dir="auto">يوسف</span><span class="ks-caption">آخر ملاحظة قبل 9 أيام</span></span></a></li>
        </ul>
      </div>
    </div>
  </div>
</div>
</body>
</html>
