<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<title>KidSphere</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600&family=Rubik:wght@400&display=swap">
<style>
  html, body { margin:0; height:100%; }
  body { background:var(--ground); color:var(--ink); font-family:var(--font-body); overflow:hidden; }
  .cover { position:relative; width:960px; height:288px; overflow:hidden; background:var(--ground); }
  /* the composition: one box from x = 480 to the right edge, clear of the name */
  .art { position:absolute; inset-block-start:0; inset-inline-start:480px; width:480px; height:288px; }
  .art svg { display:block; width:480px; height:288px; }
  /* colour blocks */
  .brand { fill:var(--brand); }
  .sun { fill:var(--paint-sun); }
  .berry { fill:var(--paint-berry); }
  .deep { fill:var(--ink); }
  .tint { fill:var(--brand-soft); }
  /* the arch opening and the pegboard holes: the ground cut out of a block */
  .cut { fill:var(--ground); }
  /* corners from the radius scale; balls and the arch take half their side */
  .r-sm { rx:var(--radius-sm); }
  .r-md { rx:var(--radius-md); }
  .r-lg { rx:var(--radius-lg); }
  .ball-96 { rx:var(--space-12); }
  .ball-24 { rx:var(--space-3); }
  /* name and tagline, bottom-left on the ground */
  .words { position:absolute; inset-inline-start:var(--space-8); inset-block-end:var(--space-8); max-width:440px; }
  .wordmark { margin:0; font-family:var(--font-display); font-size:80px; line-height:.92; font-weight:600; color:var(--ink); }
  .tagline { margin:var(--space-3) 0 0; font-family:var(--font-body); font-size:14px; line-height:20px; font-weight:400; color:var(--ink-muted); }
</style>
</head>
<body>
<div class="cover">
<div class="art" aria-hidden="true">
<svg viewBox="0 0 480 288" width="480" height="288">
<!--
  blocks       brand 240×144 arch block with a 96 half-round opening (the identity blue, the largest saturated field) · brand-soft 160×280 board bled off the top and right (the one tint, for relief) · paint-sun 96 ball · paint-berry 80 cube · ink 48 cube tilted −6° like the cube in the brand mark; about 26% of 960×288
  arrangement  the block corner as a staggered stack: every block stands on one floor space-8 above the bottom edge, level with the foot of the tagline; the arch with the sun ball on it, a berry-and-ink tower, then the tall board, rising left to right
  pattern      discs, from the soft and friendly row: the README builds every screen from block, ball, roof and arch, and the ball is the brand mark's second shape, so twenty 24px balls are cut in ground from the brand-soft board on a staggered pegboard lattice
  scales       floor and text inset space-8; gutters space-2; lattice space-12 across, space-8 up, alternate rows offset space-6, board inset space-4; arch block 5 × space-12 by 3 × space-12; corners radius-lg (arch block, board), radius-md (cube), radius-sm (small cube); ball and opening rx space-12, pegs rx space-3
-->
<rect class="tint r-lg" x="352" y="-24" width="160" height="280" rx="20"/>
<rect class="cut ball-24" x="368" y="216" width="24" height="24" rx="12"/>
<rect class="cut ball-24" x="416" y="216" width="24" height="24" rx="12"/>
<rect class="cut ball-24" x="464" y="216" width="24" height="24" rx="12"/>
<rect class="cut ball-24" x="392" y="184" width="24" height="24" rx="12"/>
<rect class="cut ball-24" x="440" y="184" width="24" height="24" rx="12"/>
<rect class="cut ball-24" x="368" y="152" width="24" height="24" rx="12"/>
<rect class="cut ball-24" x="416" y="152" width="24" height="24" rx="12"/>
<rect class="cut ball-24" x="464" y="152" width="24" height="24" rx="12"/>
<rect class="cut ball-24" x="392" y="120" width="24" height="24" rx="12"/>
<rect class="cut ball-24" x="440" y="120" width="24" height="24" rx="12"/>
<rect class="cut ball-24" x="368" y="88" width="24" height="24" rx="12"/>
<rect class="cut ball-24" x="416" y="88" width="24" height="24" rx="12"/>
<rect class="cut ball-24" x="464" y="88" width="24" height="24" rx="12"/>
<rect class="cut ball-24" x="392" y="56" width="24" height="24" rx="12"/>
<rect class="cut ball-24" x="440" y="56" width="24" height="24" rx="12"/>
<rect class="cut ball-24" x="368" y="24" width="24" height="24" rx="12"/>
<rect class="cut ball-24" x="416" y="24" width="24" height="24" rx="12"/>
<rect class="cut ball-24" x="464" y="24" width="24" height="24" rx="12"/>
<rect class="cut ball-24" x="392" y="-8" width="24" height="24" rx="12"/>
<rect class="cut ball-24" x="440" y="-8" width="24" height="24" rx="12"/>
<rect class="brand r-lg" x="16" y="112" width="240" height="144" rx="20"/>
<rect class="cut ball-96" x="88" y="208" width="96" height="96" rx="48"/>
<rect class="sun ball-96" x="40" y="16" width="96" height="96" rx="48"/>
<rect class="berry r-md" x="264" y="176" width="80" height="80" rx="14"/>
<rect class="deep r-sm" x="280" y="128" width="48" height="48" rx="8" transform="rotate(-6 280 176)"/>
</svg>
</div>
<div class="words">
<h1 class="wordmark">KidSphere</h1>
<p class="tagline">The block corner, painted.</p>
</div>
</div>
</body>
</html>
