<!-- @dsCard group="Play" height=720 subtitle="Chunky toy-key buttons for children: 64px tall, rounded type, a hard lip that presses down" -->
<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>KidButton preview</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+Bhaijaan+2:wght@400..800&family=Fredoka:wght@300..700&family=Rubik:wght@300..900&display=swap">
</head>
<body>
<div class="ks-preview">
  <div class="ks-stage" lang="en" dir="ltr">
    <div class="ks-stage__inner ks-stack">
      <div class="ks-row">
        <button type="button" class="ks-kidbtn ks-kidbtn--brand">
          <svg class="ks-glyph ks-glyph--28" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/></svg>
          Play again
        </button>
        <button type="button" class="ks-kidbtn ks-kidbtn--plain">
          <img class="ks-ico ks-ico--28 ks-ico--mirror ks-ico--l" src="../../assets/Icons/story.svg" alt=""><img class="ks-ico ks-ico--28 ks-ico--mirror ks-ico--d" src="../../assets/Icons/dark/story.svg" alt="">
          Read again
        </button>
        <button type="button" class="ks-kidbtn ks-kidbtn--plain">I told my story!</button>
      </div>
      <p class="ks-note">brand and plain at rest</p>
      <div class="ks-row">
        <button type="button" class="ks-kidbtn ks-kidbtn--brand is-hover">Listen</button>
        <button type="button" class="ks-kidbtn ks-kidbtn--brand is-pressed">Listen</button>
        <button type="button" class="ks-kidbtn ks-kidbtn--plain is-hover">Listen</button>
        <button type="button" class="ks-kidbtn ks-kidbtn--plain is-focus">Listen</button>
        <button type="button" class="ks-kidbtn ks-kidbtn--brand" disabled>Listen</button>
      </div>
      <p class="ks-note">hover, pressed, plain hover, keyboard focus (3px offset), disabled</p>
    </div>
  </div>
  <div class="ks-stage" lang="ar" dir="rtl">
    <div class="ks-stage__inner ks-row">
      <button type="button" class="ks-kidbtn ks-kidbtn--brand">
        <svg class="ks-glyph ks-glyph--28" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/></svg>
        نلعب مرة أخرى
      </button>
      <button type="button" class="ks-kidbtn ks-kidbtn--plain">حكيتُ قصتي!</button>
    </div>
  </div>
  <div class="ks-stage" lang="he" dir="rtl">
    <div class="ks-stage__inner ks-row">
      <button type="button" class="ks-kidbtn ks-kidbtn--brand">משחקים שוב</button>
      <button type="button" class="ks-kidbtn ks-kidbtn--plain">
        <img class="ks-ico ks-ico--28 ks-ico--mirror ks-ico--l" src="../../assets/Icons/story.svg" alt=""><img class="ks-ico ks-ico--28 ks-ico--mirror ks-ico--d" src="../../assets/Icons/dark/story.svg" alt="">
        קוראים שוב
      </button>
    </div>
  </div>
</div>
</body>
</html>
