<!-- @dsCard group="Play" height=740 subtitle="Big rounded titles over a story or game, with a short muted intro" -->
<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>KidHeading preview</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+Bhaijaan+2:wght@400..800&family=Fredoka:wght@300..700&family=Rubik:wght@300..900&display=swap">
</head>
<body>
<div class="ks-preview">
  <div class="ks-stage" lang="en" dir="ltr">
    <header class="ks-kidhead">
      <h2 class="ks-kidhead__title" dir="auto">What happens next?</h2>
      <p class="ks-kidhead__intro" dir="auto">Tap the pictures in order</p>
    </header>
    <p class="ks-kid-story" dir="auto">Adam built a tall tower, and the little red car drove under the arch.</p>
  </div>
  <div class="ks-stage" lang="ar" dir="rtl">
    <header class="ks-kidhead">
      <h2 class="ks-kidhead__title" dir="auto">ماذا يحدث بعد ذلك؟</h2>
      <p class="ks-kidhead__intro" dir="auto">اضغط على الصور بالترتيب</p>
    </header>
  </div>
  <div class="ks-stage" lang="he" dir="rtl">
    <header class="ks-kidhead">
      <h2 class="ks-kidhead__title" dir="auto">מה קורה אחר כך?</h2>
      <p class="ks-kidhead__intro" dir="auto">לחץ/י על התמונות לפי הסדר</p>
    </header>
  </div>
</div>
</body>
</html>
