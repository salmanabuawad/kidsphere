<!-- @dsCard group="Actions" height=280 subtitle="Square icon-only actions; always labelled with aria-label and title" -->
<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>IconButton preview</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+Bhaijaan+2:wght@400..800&family=Fredoka:wght@300..700&family=Rubik:wght@300..900&display=swap">
</head>
<body>
<div class="ks-preview" lang="en" dir="ltr">
  <div class="ks-stack ks-stack--tight">
    <p class="ks-note">Variants: ghost (default), secondary, soft, primary, toggled</p>
    <div class="ks-row">
      <button type="button" class="ks-iconbtn" aria-label="Edit" title="Edit">
        <svg class="ks-glyph" viewBox="0 0 24 24" aria-hidden="true"><path d="M21.174 6.812a1 1 0 0 0-3.986-3.987L3.842 16.174a2 2 0 0 0-.5.83l-1.321 4.352a.5.5 0 0 0 .623.622l4.353-1.32a2 2 0 0 0 .83-.497z"/><path d="m15 5 4 4"/></svg>
      </button>
      <button type="button" class="ks-iconbtn ks-iconbtn--secondary" aria-label="More" title="More">
        <svg class="ks-glyph" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/><circle cx="5" cy="12" r="1"/></svg>
      </button>
      <button type="button" class="ks-iconbtn ks-iconbtn--soft" aria-label="Change the time" title="Change the time">
        <svg class="ks-glyph" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 2v4"/><path d="M16 2v4"/><rect width="18" height="18" x="3" y="4" rx="2"/><path d="M3 10h18"/></svg>
      </button>
      <button type="button" class="ks-iconbtn ks-iconbtn--primary" aria-label="Add observation" title="Add observation">
        <svg class="ks-glyph" viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"/><path d="M15.4 15.4 20.5 20.5" stroke-width="3"/><path d="M8 10.5h5M10.5 8v5" stroke-width="2.5"/></svg>
      </button>
      <button type="button" class="ks-iconbtn" aria-pressed="true" aria-label="Show plan" title="Show plan">
        <img class="ks-ico ks-ico--20 ks-ico--l" src="../../assets/Icons/current-focus.svg" alt=""><img class="ks-ico ks-ico--20 ks-ico--d" src="../../assets/Icons/dark/current-focus.svg" alt="">
      </button>
    </div>
  </div>

  <div class="ks-stack ks-stack--tight">
    <p class="ks-note">Ghost states: rest, hover, focus, disabled. Small (36px, 44px on touch) for dense rows.</p>
    <div class="ks-row">
      <button type="button" class="ks-iconbtn" aria-label="Close" title="Close"><svg class="ks-glyph" viewBox="0 0 24 24" aria-hidden="true"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg></button>
      <button type="button" class="ks-iconbtn is-hover" aria-label="Close" title="Close"><svg class="ks-glyph" viewBox="0 0 24 24" aria-hidden="true"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg></button>
      <button type="button" class="ks-iconbtn is-focus" aria-label="Close" title="Close"><svg class="ks-glyph" viewBox="0 0 24 24" aria-hidden="true"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg></button>
      <button type="button" class="ks-iconbtn" disabled aria-label="Close" title="Close"><svg class="ks-glyph" viewBox="0 0 24 24" aria-hidden="true"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg></button>
      <button type="button" class="ks-iconbtn ks-iconbtn--sm" aria-label="Clear search" title="Clear search"><svg class="ks-glyph" viewBox="0 0 24 24" aria-hidden="true"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg></button>
      <button type="button" class="ks-iconbtn ks-iconbtn--sm ks-iconbtn--secondary" aria-label="Remove Music" title="Remove Music"><svg class="ks-glyph" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 6h18"/><path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"/><path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"/><path d="M10 11v6"/><path d="M14 11v6"/></svg></button>
    </div>
  </div>

  <div class="ks-stack ks-stack--tight" lang="he" dir="rtl">
    <p class="ks-note">בעברית: החץ "חזרה" מצביע ימינה, תפריט ועריכה לא מתהפכים</p>
    <div class="ks-row">
      <button type="button" class="ks-iconbtn ks-iconbtn--secondary" aria-label="חזרה לפרופיל" title="חזרה לפרופיל">
        <svg class="ks-glyph ks-glyph--mirror" viewBox="0 0 24 24" aria-hidden="true"><path d="m15 18-6-6 6-6"/></svg>
      </button>
      <button type="button" class="ks-iconbtn" aria-label="תפריט" title="תפריט">
        <svg class="ks-glyph" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 12h16"/><path d="M4 6h16"/><path d="M4 18h16"/></svg>
      </button>
      <button type="button" class="ks-iconbtn" aria-label="עריכה" title="עריכה">
        <svg class="ks-glyph" viewBox="0 0 24 24" aria-hidden="true"><path d="M21.174 6.812a1 1 0 0 0-3.986-3.987L3.842 16.174a2 2 0 0 0-.5.83l-1.321 4.352a.5.5 0 0 0 .623.622l4.353-1.32a2 2 0 0 0 .83-.497z"/><path d="m15 5 4 4"/></svg>
      </button>
      <button type="button" class="ks-iconbtn ks-iconbtn--soft" aria-label="צפייה בהתפתחות" title="צפייה בהתפתחות">
        <img class="ks-ico ks-ico--20 ks-ico--mirror ks-ico--l" src="../../assets/Icons/development.svg" alt=""><img class="ks-ico ks-ico--20 ks-ico--mirror ks-ico--d" src="../../assets/Icons/dark/development.svg" alt="">
      </button>
    </div>
  </div>
</div>
</body>
</html>
